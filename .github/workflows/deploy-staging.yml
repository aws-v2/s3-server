name: Staging Deployment

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/s3-server:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create mini-aws-network || true
            docker pull qarani/s3-server:staging
            docker stop s3-server-staging || true
            docker rm s3-server-staging || true
            docker run -d --name s3-server-staging \
              --network mini-aws-network \
              -p 8082:8099 \
              -e APP_PROFILE=staging \
              -e SERVER_PORT=8099 \
              -e POSTGRES_HOST=postgres-staging \
              -e POSTGRES_PORT=5432 \
              -e POSTGRES_USER=root \
              -e POSTGRES_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }} \
              -e POSTGRES_DB=s3 \
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USER=auth-server \
              -e NATS_PASSWORD=auth-secret \
              -e MINIO_ENDPOINT=minio-staging:9000 \
              -e MINIO_ACCESS_KEY=${{ secrets.STAGING_MINIO_ACCESS_KEY }} \
              -e MINIO_SECRET_KEY=${{ secrets.STAGING_MINIO_SECRET_KEY }} \
              qarani/s3-server:staging