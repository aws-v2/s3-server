name: Staging Deployment

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          qarani/s3-server:staging-${{github.sha}}
          qarani/s3-server:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws-staging-network || true
            docker pull qarani/s3-server:staging-${{github.sha}}
            docker stop s3-server-staging || true
            docker rm s3-server-staging || true
            docker run -d --name s3-server-staging \
              --network aws-staging-network \
              -p 8082:8099 \
              -e APP_PROFILE=staging \
              -e SERVER_PORT=8099 \
              -e POSTGRES_HOST=postgres-staging \
              -e EUREKA_HOSTNAME=s3-server-staging\
              -e EUREKA_IP_ADDR=8761 \
              -e POSTGRES_PORT=5432 \
              -e POSTGRES_USER=postgres-staging-user \
              -e POSTGRES_PASSWORD=postgres-staging-password \
              -e POSTGRES_DB=s3_db \
              -e POSTGRES_SSL_MODE=disable \
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USER=nats-staging-user \
              -e NATS_PASSWORD=nats-staging-user \
              -e MINIO_ENDPOINT=minio-staging:9000 \
              -e MINIO_ACCESS_KEY=minio-staging-user \
              -e MINIO_SECRET_KEY=postgres-staging-password \
              -e MINIO_USE_SSL=false \
              -e EUREKA_SERVER_URL=http://discovery-server-staging:8761/eureka \
              -e EUREKA_APP_NAME=S3-SERVICE \
              -e EUREKA_HOSTNAME=s3-server-staging \
              -e EUREKA_IP_ADDR=127.0.0.1 \
              -e EUREKA_VIP_ADDRESS=s3-service \
              -e EUREKA_INSTANCE_ID=s3-service-staging:8099 \
              qarani/s3-server:staging-${{github.sha}}


  open-pr-to-main:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR staging → main
        run: |
          if gh pr list --base main --head staging --state open --json number | jq -e 'length > 0' > /dev/null; then
            echo "PR already exists. Skipping..."
          else
            gh pr create \
              --base main \
              --head staging \
              --title "chore: promote staging → main" \
              --body "✅ Staging deployment succeeded. Auto-generated PR for production release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}