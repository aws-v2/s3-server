name: Prod deployment.

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: qarani/s3-server:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull qarani/s3-server:latest
            docker stop s3-server || true
            docker rm s3-server || true
            docker network create mini-aws-network || true
            docker run -d --name s3-server \
              --network mini-aws-network \
              -p 8082:8099 \
              -e APP_PROFILE=prod \
              -e SERVER_PORT=8099 \
              -e POSTGRES_HOST=postgres-prod \
              -e POSTGRES_PORT=5432 \
              -e POSTGRES_USER=root \
              -e POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
              -e POSTGRES_DB=s3 \
              -e NATS_URL=nats://nats-prod:4222 \
              -e NATS_USER=auth-server \
              -e NATS_PASSWORD=${{ secrets.PROD_NATS_PASSWORD }} \
              -e MINIO_ENDPOINT=minio-prod:9000 \
              -e MINIO_ACCESS_KEY=${{ secrets.PROD_MINIO_ACCESS_KEY }} \
              -e MINIO_SECRET_KEY=${{ secrets.PROD_MINIO_SECRET_KEY }} \
              qarani/s3-server:latest
