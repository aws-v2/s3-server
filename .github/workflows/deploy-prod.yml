name: Prod deployment env

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  prod-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon \
            pkg-config
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./... -v

  prod-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: prod-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/s3-server:prod

  prod-deploy:
    needs: prod-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
          
            docker network create --driver overlay --attachable aws-prod-network  || true

            docker pull qarani/s3-server:prod
            docker service rm s3-server-prod || true

            docker service create \
              --name s3-server-prod \
              --network aws-prod-network \
              --publish published=8082,target=8099 \
              --env APP_PROFILE=prod \
              --env SERVER_PORT=8099 \
              --env POSTGRES_HOST=postgres-prod \
              --env POSTGRES_PORT=5432 \
              --env POSTGRES_USER=postgres-prod-user \
              --env POSTGRES_PASSWORD=postgres-prod-password \
              --env POSTGRES_DB=s3_db \
              --env POSTGRES_SSL_MODE=disable \
              --env EUREKA_HOSTNAME=s3-server-prod \
              --env EUREKA_IP_ADDR=127.0.0.1 \
              --env EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              --env EUREKA_APP_NAME=S3-SERVICE \
              --env EUREKA_VIP_ADDRESS=s3-service \
              --env EUREKA_INSTANCE_ID=s3-service-prod:8099 \
              --env NATS_URL=nats://nats-prod:4222 \
              --env NATS_USER=nats-prod-user \
              --env NATS_PASSWORD=nats-prod-password \
              --env MINIO_ENDPOINT=minio-prod:9000 \
              --env MINIO_ACCESS_KEY=minio-prod-user \
              --env MINIO_SECRET_KEY=minio-prod-password \
              --env MINIO_USE_SSL=false \
              qarani/s3-server:prod



